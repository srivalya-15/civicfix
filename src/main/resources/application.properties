server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/civicfix?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

civicfix.upload-dir=${CIVICFIX_UPLOAD_DIR:uploads}

# Default admin account created on first run
civicfix.admin.email=${CIVICFIX_ADMIN_EMAIL:admin@civicfix.com}
civicfix.admin.password=${CIVICFIX_ADMIN_PASSWORD:changeme123}
