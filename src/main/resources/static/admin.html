<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CivicFix - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>

<div class="container-fluid px-4 my-4">
    <div class="row g-3 mb-3" id="stats"></div>
    <div class="card p-3">
        <div class="d-flex justify-content-between mb-2">
            <h5>All Complaints</h5>
            <select id="flt" class="form-select w-auto" onchange="render()">
                <option value="">All statuses</option>
                <option>SUBMITTED</option><option>VERIFIED</option><option>ASSIGNED</option>
                <option>IN_PROGRESS</option><option>RESOLVED</option>
            </select>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead><tr><th>ID</th><th>Issue</th><th>Reported By</th><th>Area</th><th>Severity</th><th>Priority</th><th>Status</th><th>Department</th><th>Photo</th><th>Action</th></tr></thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
<script>
    let all = [], depts = [];

    (async () => {
        const me = await initNav();
        if (!me.loggedIn) { location.href = 'login.html'; return; }
        if (me.role !== 'ADMIN') {
            document.body.insertAdjacentHTML('beforeend',
                '<div class="container my-5"><div class="alert alert-danger">Access denied. Admins only.</div></div>');
            return;
        }
        load();
    })();

    async function load() {
        depts = await api('/api/departments');
        all = await api('/api/admin/complaints');
        const s = await api('/api/admin/stats');
        $('stats').innerHTML = [
            ['Total', s.total, 'dark'], ['Submitted', s.SUBMITTED, 'secondary'], ['Verified', s.VERIFIED, 'info'],
            ['Assigned', s.ASSIGNED, 'primary'], ['In Progress', s.IN_PROGRESS, 'warning'],
            ['Resolved', s.RESOLVED, 'success'], ['Critical', s.critical, 'danger']
        ].map(x => `<div class="col"><div class="card stat border-start border-4 border-${x[2]}"><h3>${x[1]}</h3><small>${x[0]}</small></div></div>`).join('');
        render();
    }

    function render() {
        const f = $('flt').value;
        $('rows').innerHTML = all.filter(c => !f || c.status === f).map(c => {
            const next = STEPS[STEPS.indexOf(c.status) + 1];
            let action = '<span class="text-success">✔ Done</span>';
            if (next) {
                const sel = next === 'ASSIGNED'
                    ? `<select id="d${esc(c.complaintCode)}" class="form-select form-select-sm mb-1">${depts.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select>` : '';
                action = `${sel}<button class="btn btn-sm btn-primary" onclick="advance('${esc(c.complaintCode)}','${next}')">Mark ${next.replace('_', ' ')}</button>`;
            }
            return `<tr>
      <td><b>${esc(c.complaintCode)}</b></td>
      <td>${esc(c.issueType)}<br><small class="text-muted">${esc(c.location)}</small></td>
      <td>${esc(c.citizenName)}</td>
      <td>${esc(c.area)}</td><td>${esc(c.severity)}</td>
      <td><span class="badge text-bg-${PRI[c.priority]}">${c.priority}</span></td>
      <td>${esc(c.status.replace('_', ' '))}</td>
      <td>${c.department ? esc(c.department.name) : '-'}</td>
      <td>${c.photoPath ? `<a href="${esc(c.photoPath)}" target="_blank">View</a>` : '-'}</td>
      <td>${action}</td></tr>`;
        }).join('');
    }

    async function advance(code, status) {
        const dep = document.getElementById('d' + code);
        try {
            await api(`/api/admin/complaints/${code}/status`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status, departmentId: dep ? Number(dep.value) : null })
            });
            load();
        } catch (err) { alert(err.message); }
    }
</script>
</body>
</html>
