<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CivicFix - My Complaints</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>

<div class="container my-4">
    <div class="card p-4">
        <h4 class="mb-3">My Complaints</h4>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead><tr><th>ID</th><th>Issue</th><th>Area</th><th>Priority</th><th>Status</th><th>Submitted</th><th></th></tr></thead>
                <tbody id="rows"><tr><td colspan="7">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
<script>
    (async () => {
        const me = await initNav();
        if (!me.loggedIn) { location.href = 'login.html'; return; }
        const list = await api('/api/my/complaints');
        $('rows').innerHTML = list.length ? list.map(c => `<tr>
      <td><b>${esc(c.complaintCode)}</b></td>
      <td>${esc(c.issueType)}</td>
      <td>${esc(c.area)}</td>
      <td><span class="badge text-bg-${PRI[c.priority]}">${c.priority}</span></td>
      <td>${esc(c.status.replace('_', ' '))}</td>
      <td>${esc(c.createdAt.replace('T', ' ').substring(0, 16))}</td>
      <td><a class="btn btn-sm btn-outline-primary" href="track.html?id=${encodeURIComponent(c.complaintCode)}">Track</a></td>
    </tr>`).join('')
            : '<tr><td colspan="7" class="text-muted">You have not reported any complaints yet.</td></tr>';
    })();
</script>
</body>
</html>
