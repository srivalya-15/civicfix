<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CivicFix - Report a Problem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>

<div class="hero text-center">
    <h1 class="fw-bold">See a problem? Report it. Track it. Get it fixed.</h1>
    <p class="lead mb-0">Potholes, garbage, water leakage, broken streetlights and more.</p>
</div>

<div class="container my-4" style="max-width: 760px;">
    <div id="result"></div>
    <div class="card p-4">
        <h4 class="mb-3">Submit a Complaint</h4>
        <form id="f">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Issue Type</label>
                    <select name="issueType" class="form-select" required>
                        <option>Pothole</option>
                        <option>Broken Streetlight</option>
                        <option>Uncollected Garbage</option>
                        <option>Water Leakage</option>
                        <option>Damaged Road</option>
                        <option>Open Drain</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">How severe is it?</label>
                    <select name="severity" class="form-select" required>
                        <option value="LOW">Low - minor inconvenience</option>
                        <option value="MEDIUM" selected>Medium - needs attention</option>
                        <option value="HIGH">High - dangerous / urgent</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Area / Locality</label>
                    <input name="area" class="form-control" placeholder="e.g. Madhapur" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Exact Location / Landmark</label>
                    <input name="location" class="form-control" placeholder="e.g. Near City Mall" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3" required></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">Photograph</label>
                    <input type="file" name="photo" accept="image/*" class="form-control">
                </div>
                <div class="col-12">
                    <button id="btn" class="btn btn-primary w-100">Submit Complaint</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script src="js/app.js"></script>
<script>
    initNav().then(me => { if (!me.loggedIn) location.href = 'login.html'; });

    $('f').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = $('btn'), out = $('result');
        btn.disabled = true; btn.textContent = 'Submitting...';
        try {
            const d = await api('/api/complaints', { method: 'POST', body: new FormData(e.target) });
            out.innerHTML = `<div class="alert alert-success">
      ✅ Complaint submitted! Your Complaint ID is <b>${esc(d.complaintCode)}</b>
      (Priority: <b>${esc(d.priority)}</b>).
      <a href="track.html?id=${encodeURIComponent(d.complaintCode)}">Track now →</a></div>`;
            e.target.reset();
            window.scrollTo(0, 0);
        } catch (err) {
            if (err.status === 401) { location.href = 'login.html'; return; }
            out.innerHTML = `<div class="alert alert-danger">${esc(err.message)}</div>`;
        }
        btn.disabled = false; btn.textContent = 'Submit Complaint';
    });
</script>
</body>
</html>
