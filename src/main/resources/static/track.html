<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CivicFix - Track Complaint</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>

<div class="container my-4" style="max-width: 800px;">
    <div class="card p-4 mb-3">
        <h4>Track Your Complaint</h4>
        <div class="input-group">
            <input id="cid" class="form-control" placeholder="Enter Complaint ID e.g. CF00001">
            <button class="btn btn-primary" onclick="track($('cid').value)">Track</button>
        </div>
    </div>
    <div id="out"></div>
</div>

<script src="js/app.js"></script>
<script>
    initNav();

    async function track(id) {
        const out = $('out');
        if (!id) return;
        try {
            const c = await api('/api/complaints/' + encodeURIComponent(id.trim()));
            const n = await api(`/api/complaints/${encodeURIComponent(c.complaintCode)}/notifications`);
            const idx = STEPS.indexOf(c.status);
            out.innerHTML = `
    <div class="card p-4 mb-3">
      <div class="d-flex justify-content-between flex-wrap">
        <h5>${esc(c.complaintCode)} - ${esc(c.issueType)}</h5>
        <span class="badge text-bg-${PRI[c.priority]} align-self-start">${c.priority} PRIORITY</span>
      </div>
      <p class="mb-1"><b>Area:</b> ${esc(c.area)} | <b>Location:</b> ${esc(c.location)}</p>
      <p class="mb-1"><b>Description:</b> ${esc(c.description)}</p>
      <p class="mb-3"><b>Department:</b> ${c.department ? esc(c.department.name) : 'Not assigned yet'}</p>
      <div class="stepper mb-3">
        ${STEPS.map((s, i) => `<div class="step ${i < idx || c.status === 'RESOLVED' ? 'done' : i === idx ? 'current' : ''}">${s.replace('_', ' ')}</div>`).join('')}
      </div>
      ${c.photoPath ? `<img src="${esc(c.photoPath)}" class="img-fluid rounded" style="max-height:260px">` : ''}
    </div>
    <div class="card p-4">
      <h6>🔔 Notifications</h6>
      <ul class="list-group list-group-flush">
        ${n.map(x => `<li class="list-group-item">${esc(x.message)}<br><small class="text-muted">${esc(x.createdAt.replace('T', ' ').substring(0, 16))}</small></li>`).join('')}
      </ul>
    </div>`;
        } catch (err) {
            out.innerHTML = `<div class="alert alert-danger">${esc(err.message)}</div>`;
        }
    }

    const q = new URLSearchParams(location.search).get('id');
    if (q) { $('cid').value = q; track(q); }
</script>
</body>
</html>
