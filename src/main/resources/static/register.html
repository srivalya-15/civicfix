<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CivicFix - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<div class="auth-bg">
    <div class="container my-4" style="max-width: 460px;">
        <div class="card p-4">
            <h4 class="mb-1">Create your account</h4>
            <p class="text-muted">Citizens need an account to report problems.</p>
            <div id="msg"></div>
            <form id="f">
                <label class="form-label">Full Name</label>
                <input id="name" class="form-control mb-3" required>
                <label class="form-label">Email</label>
                <input id="email" type="email" class="form-control mb-3" required>
                <label class="form-label">Phone (optional)</label>
                <input id="phone" class="form-control mb-3">
                <label class="form-label">Password (min 6 characters)</label>
                <input id="pwd" type="password" minlength="6" class="form-control mb-3" required>
                <button class="btn btn-success w-100">Register</button>
            </form>
            <p class="mt-3 mb-0 text-center">Already registered? <a href="login.html">Login</a></p>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
<script>
    initNav();

    $('f').addEventListener('submit', async e => {
        e.preventDefault();
        try {
            await api('/api/auth/register', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: $('name').value, email: $('email').value, phone: $('phone').value, password: $('pwd').value })
            });
            location.href = 'index.html';
        } catch (err) {
            $('msg').innerHTML = `<div class="alert alert-danger py-2">${esc(err.message)}</div>`;
        }
    });
</script>
</body>
</html>
